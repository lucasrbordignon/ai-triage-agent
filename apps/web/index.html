<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Assistente Inteligente | Atendimento Rápido</title>
    <meta name="description" content="Converse com nosso agente de IA para vendas, suporte ou financeiro. Rápido, inteligente e disponível 24/7." />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>

  <body class="antialiased bg-zinc-950 text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("Service Worker registrado!", reg))
            .catch((err) => console.error("Falha ao registrar SW:", err));
        });
      }
    </script>
    
    <noscript>
      <div class="fixed inset-0 flex items-center justify-center bg-zinc-950 text-zinc-300 p-6 text-center">
        <div>
          <h1 class="text-2xl font-bold mb-4">JavaScript está desativado</h1>
          <p>Esta aplicação requer JavaScript para funcionar corretamente.<br />Por favor, ative-o nas configurações do seu navegador.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
